<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>azd · Extension auto-install — interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ===================================================================
   TOKENS
   =================================================================== */
:root{
  --bg:#0b0d12;
  --bg-2:#111520;
  --panel:#151b28;
  --border:#26303f;
  --text:#d7e0ea;
  --muted:#8a97a8;
  --dim:#5c6b7e;
  --accent:#4c9bf5;          /* Figma scenario-card blue */
  --accent-soft:rgba(76,155,245,.14);
  /* terminal palette (matches the Figma black terminals) */
  --term-bg:#000000;
  --t-text:#d9d9d9;
  --t-orange:#d79a5b;        /* "Installing … Extension" */
  --t-blue:#4aa8e0;          /* user input / selected source */
  --t-green:#4ec94e;         /* (✓) Done */
  --t-red:#f14c4c;           /* errors */
  --t-amber:#e0a458;         /* ? question glyph */
  --t-dim:#949494;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(76,155,245,.10), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:2.4rem 1.5rem 3rem;
}
.wrap{width:100%; max-width:1020px}

/* ===================================================================
   HEADER
   =================================================================== */
.kicker{
  font-family:var(--mono); font-size:.74rem; letter-spacing:.2em;
  text-transform:uppercase; color:var(--accent);
  display:flex; align-items:center; gap:.55rem; margin-bottom:.9rem;
}
.kicker::before{content:"▍"; color:var(--accent)}
h1{font-size:clamp(1.7rem,3.4vw,2.5rem); font-weight:800; letter-spacing:-.02em; line-height:1.05}
h1 .mono{font-family:var(--mono); color:var(--accent)}
.lede{color:var(--muted); margin-top:.7rem; max-width:60ch; font-size:1.02rem; line-height:1.55}

/* ===================================================================
   SCENARIO TABS
   =================================================================== */
.tabs{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:.8rem; margin:1.8rem 0 1.3rem}
@media(max-width:760px){.tabs{grid-template-columns:1fr}}
.tab{
  text-align:left; cursor:pointer; color:inherit;
  background:var(--panel); border:1px solid var(--border);
  border-radius:12px; padding:.9rem 1rem; transition:.18s;
  display:flex; gap:.75rem; align-items:flex-start;
}
.tab:hover{border-color:#37475c; transform:translateY(-2px)}
.tab.active{border-color:var(--accent); background:linear-gradient(180deg,var(--accent-soft),transparent), var(--panel); box-shadow:0 10px 30px -18px rgba(76,155,245,.7)}
.tab .idx{
  font-family:var(--mono); font-weight:700; font-size:.8rem; color:#fff;
  background:var(--accent); border-radius:7px; min-width:1.7rem; height:1.7rem;
  display:grid; place-items:center; flex:none; opacity:.9;
}
.tab.active .idx{opacity:1}
.tab .t-title{font-weight:600; font-size:.95rem; color:var(--text); line-height:1.2}
.tab .t-sub{font-size:.8rem; color:var(--dim); margin-top:.22rem; line-height:1.35}

/* ===================================================================
   TERMINAL
   =================================================================== */
.terminal{
  background:var(--term-bg);
  border:1px solid #1c1c1c;
  border-radius:12px; overflow:hidden;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.02);
}
.term-bar{
  display:flex; align-items:center; gap:.5rem;
  background:#0e0e0e; border-bottom:1px solid #1c1c1c;
  padding:.55rem .85rem;
}
.dot{width:11px;height:11px;border-radius:50%}
.dot.r{background:#ff5f56}.dot.y{background:#ffbd2e}.dot.g{background:#27c93f}
.term-bar .title{margin-left:.55rem; color:var(--t-dim); font-family:var(--mono); font-size:.76rem}
#screen{
  font-family:var(--mono); font-size:14px; line-height:1.55; color:var(--t-text);
  padding:1.05rem 1.25rem; height:430px; overflow-y:auto; white-space:pre-wrap; word-break:break-word;
  outline:none;
}
#screen::-webkit-scrollbar{width:9px}
#screen::-webkit-scrollbar-thumb{background:#222; border-radius:5px}
.ln{min-height:1.1em}
.blank{height:.85em}

/* terminal text colors */
.o{color:var(--t-orange)}
.b{color:var(--t-blue)}
.g{color:var(--t-green)}
.e{color:var(--t-red)}
.warn{color:#ffcc00}
.q{color:var(--t-blue)}
.d{color:var(--t-dim)}
.w{color:#f2f2f2}

/* caret */
.caret{display:inline-block; width:8px; height:1.05em; background:var(--t-text); vertical-align:-2px; margin-left:1px; animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* inline env-name input */
.envinput{
  font-family:var(--mono); font-size:14px; color:var(--t-blue);
  background:transparent; border:none; outline:none; caret-color:var(--t-text);
  min-width:2ch;
}

/* interactive source list */
.srclist{margin:.15rem 0}
.srcrow{
  padding:.05rem 0; cursor:pointer; border-radius:4px;
  display:flex; gap:.55rem; white-space:pre;
}
.srcrow:hover{background:rgba(255,255,255,.04)}
.srcrow .cursor-col{width:1.1ch; color:var(--t-blue)}
.srcrow .box{color:var(--t-text)}
.srcrow.cur .box{color:var(--t-blue)}
.srcrow .name{color:var(--t-text)}
.srcrow.cur .name{color:var(--t-blue)}
.srcrow .desc{color:var(--t-dim)}
.srcdivider{color:#333; user-select:none}
.srchint{color:var(--t-dim)}

/* ===================================================================
   ACTION DOCK
   =================================================================== */
.dock{
  margin-top:1rem; display:flex; flex-wrap:wrap; align-items:center; gap:.6rem;
  min-height:44px;
}
.dockhint{color:var(--muted); font-size:.85rem; font-family:var(--mono)}
.donerow{display:flex; align-items:center; gap:1rem; flex-wrap:wrap}
.dockhint kbd{
  font-family:var(--mono); background:var(--bg-2); border:1px solid var(--border);
  border-radius:4px; padding:.03rem .35rem; color:var(--muted); font-size:.78rem
}
button.act{
  font-family:var(--sans); font-weight:600; font-size:.88rem; cursor:pointer;
  color:var(--text); background:var(--panel); border:1px solid var(--border);
  border-radius:9px; padding:.5rem .95rem; transition:.16s;
  display:inline-flex; align-items:center; gap:.45rem;
}
button.act:hover{border-color:var(--accent); color:#fff; background:#1a2230}
button.act.primary{background:var(--accent); border-color:var(--accent); color:#03121f}
button.act.primary:hover{background:#5fa8f7}
button.act .k{font-family:var(--mono); font-size:.72rem; opacity:.7}
.spacer{flex:1}
button.ghost{
  font-family:var(--sans); font-size:.82rem; cursor:pointer; color:var(--muted);
  background:transparent; border:1px solid var(--border); border-radius:9px;
  padding:.42rem .8rem; transition:.16s;
}
button.ghost:hover{color:#fff; border-color:#37475c}

.footer{margin-top:1.5rem; color:var(--dim); font-size:.78rem; font-family:var(--mono); text-align:center}
.badge-done{
  display:inline-flex; align-items:center; gap:.4rem;
  color:var(--t-green); font-family:var(--mono); font-size:.85rem;
}
@media (prefers-reduced-motion: reduce){.caret{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">azd · extension auto-install</div>
  <h1><span class="mono">azd up</span> — Extension auto-install</h1>
  <p class="lede">An interactive prototype of the new install UX. Pick a scenario, then drive the terminal with clicks or your keyboard to see the command output and prompts play out.</p>

  <!-- Scenario switcher -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-s="1">
      <span class="idx">1</span>
      <span><span class="t-title">Install single extension</span><br><span class="t-sub">One required extension, installed from azd.</span></span>
    </button>
    <button class="tab" data-s="2">
      <span class="idx">2</span>
      <span><span class="t-title">Single extension, multiple sources</span><br><span class="t-sub">Choose between a stable and a local source.</span></span>
    </button>
    <button class="tab" data-s="3">
      <span class="idx">3</span>
      <span><span class="t-title">Install multiple extensions</span><br><span class="t-sub">Install all at once, or select individually.</span></span>
    </button>
    <button class="tab" data-s="4">
      <span class="idx">4</span>
      <span><span class="t-title">Multiple extensions, multiple sources</span><br><span class="t-sub">Install all, or pick a source per extension.</span></span>
    </button>
    <button class="tab" data-s="5">
      <span class="idx">5</span>
      <span><span class="t-title">Command requires an extension</span><br><span class="t-sub">Install the extension that provides an unavailable command.</span></span>
    </button>
    <button class="tab" data-s="6">
      <span class="idx">6</span>
      <span><span class="t-title">YOLO deployment</span><br><span class="t-sub">Install required extensions automatically, then deploy.</span></span>
    </button>
    <button class="tab" data-s="7">
      <span class="idx">7</span>
      <span><span class="t-title">No-prompt deployment</span><br><span class="t-sub">Continue without prompts or automatic extension installation.</span></span>
    </button>
  </div>

  <!-- Terminal -->
  <div class="terminal">
    <div class="term-bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title" id="termtitle">PowerShell — extension-auto-install</span>
    </div>
    <div id="screen" tabindex="0"></div>
  </div>

  <!-- Action dock -->
  <div class="dock" id="dock"></div>
</div>

<script>
/* ===================================================================
   azd extension-install — interactive prototype
   Each scenario is an async "runner" that prints output lines and
   awaits user interaction (confirm / source-select / text input).
   Input arrives via the action dock (clicks) or the keyboard.
   =================================================================== */
(function(){
  const screen = document.getElementById('screen');
  const dock   = document.getElementById('dock');
  const PROMPT = 'PS C:\\Users\\hyoshi\\Downloads\\extension-auto-install\\01-required-version';

  let pending = null;   // { type, ... , resolve }  — current interaction
  let runToken = 0;     // cancels an in-flight scenario when switching

  /* ---------- low-level output helpers ---------- */
  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  function scroll(){ screen.scrollTop = screen.scrollHeight; }
  function line(html=''){
    const d=document.createElement('div');
    d.className='ln'+(html===''?' blank':'');
    d.innerHTML=html;
    screen.appendChild(d); scroll(); return d;
  }
  async function block(lines, stagger=90){
    const token=runToken;
    for(const h of lines){ if(token!==runToken) return; line(h); await sleep(stagger); }
  }
  function clear(){ screen.innerHTML=''; }

  /* ---------- intro block (shared by all scenarios) ---------- */
  // Aligns "Label:  value" so every value starts at the same column (col 15),
  // matching the redesigned `azd up` extension-required output.
  function field(label, value){
    const pad = ' '.repeat(Math.max(1, 13 - label.length));
    return `  ${label}${pad}${escapeHtml(value)}`;
  }
  async function intro(ext, count, skipCmd, sourceLabel='Source:', requiredBy='Required by azure.yaml.'){
    const countHtml = count ? ` <span class="d">${count}</span>` : '';
    const lines = [
      `<span class="b">Extension required: ${escapeHtml(ext.title)}</span>${countHtml}`,
      field('ID:', ext.id),
      field(sourceLabel, ext.source),
      field('Description:', ext.desc),
      ``
    ];
    if(requiredBy) lines.push(requiredBy);
    if(!skipCmd) lines.unshift(`<span class="w">${PROMPT}></span> <span class="w">azd up</span>`);
    await block(lines, 95);
  }

  /* ---------- interaction: Yes / No confirm ---------- */
  function confirmYN(promptText){
    const el = line(`<span class="q">?</span> ${promptText} [Y/n]: <span class="caret"></span>`);
    return new Promise(resolve=>{
      pending = { type:'confirm', el, promptText, resolve };
      clearDock();
    });
  }
  function answerYN(v){
    if(!pending || pending.type!=='confirm') return;
    const {el, promptText, resolve} = pending;
    el.innerHTML = `<span class="q">?</span> ${promptText} [Y/n]: <span class="b">${v}</span>`;
    pending=null; clearDock(); resolve(v);
  }

  /* ---------- interaction: Yes / No / Select-individually confirm ---------- */
  // Batch prompt shown once for a set of required extensions.
  // Resolves to 'y' (install all), 'n' (skip) or 's' (select individually).
  function confirmYNC(questionHtml, labels){
    const L = Object.assign({y:'install all (default)', n:'skip', c:'choose for each extension'}, labels||{});
    const el = line(`<span class="q">?</span> ${questionHtml} [Y/n/c]: <span class="caret"></span>`);
    const opts = [
      line(`  <span class="w">Y</span> <span class="d">- ${escapeHtml(L.y)}</span>`),
      line(`  <span class="w">n</span> <span class="d">- ${escapeHtml(L.n)}</span>`),
      line(`  <span class="w">c</span> <span class="d">- ${escapeHtml(L.c)}</span>`)
    ];
    setHint(`<kbd>Y</kbd> ${escapeHtml(L.y)} · <kbd>n</kbd> ${escapeHtml(L.n)} · <kbd>c</kbd> ${escapeHtml(L.c)}`);
    return new Promise(resolve=>{
      pending = { type:'confirm', ync:true, el, questionHtml, opts, resolve };
    });
  }
  function answerYNC(v){
    if(!pending || pending.type!=='confirm' || !pending.ync) return;
    const {el, questionHtml, opts, resolve} = pending;
    opts.forEach(o=>o.remove());
    el.innerHTML = `<span class="q">?</span> ${questionHtml} [Y/n/c]: <span class="b">${v}</span>`;
    pending=null; clearDock(); resolve(v);
  }

  function stagePromptValue(v){
    if(!pending || pending.type!=='confirm') return;
    pending.value=v;
    const input = v ? `<span class="b">${escapeHtml(v)}</span>` : '';
    pending.el.innerHTML = pending.ync
      ? `<span class="q">?</span> ${pending.questionHtml} [Y/n/c]: ${input}<span class="caret"></span>`
      : `<span class="q">?</span> ${pending.promptText} [Y/n]: ${input}<span class="caret"></span>`;
  }

  /* ---------- upfront summary of every required extension ---------- */
  async function listExtensions(exts, sourceHeading='Source (recommended)', command='azd up'){
    const colHead = `  <span class="d">${'Extension'.padEnd(18,' ')}${'ID'.padEnd(20,' ')}${sourceHeading}</span>`;
    const rows = exts.map(e=>
      `  <span class="w">${escapeHtml(e.title.padEnd(18,' '))}</span>`+
      `<span class="w">${escapeHtml(e.id.padEnd(20,' '))}</span>`+
      `<span class="w">${escapeHtml(e.source)}</span>`+
      (e.sourceNote ? ` <span class="d">${escapeHtml(e.sourceNote)}</span>` : ''));
    await block([
      `<span class="w">${PROMPT}></span> <span class="w">${escapeHtml(command)}</span>`,
      `<span class="b">${exts.length} extensions required by azure.yaml:</span>`,
      ``,
      colHead,
      ...rows,
      ``
    ], 90);
  }

  /* ---------- interaction: select an action ---------- */
  function selectAction(questionHtml, options){
    const headerEl = line(`<span class="q">?</span> ${questionHtml}`);
    const blankEl = line('');
    const listEl = document.createElement('div');
    listEl.className='ln srclist actionlist';
    screen.appendChild(listEl);
    const dividerEl = line('<span class="srcdivider">────────────────────────────────────────</span>');
    scroll();

    let cursor=0;
    function render(){
      listEl.innerHTML = options.map((option,i)=>{
        const isCur=i===cursor;
        return `<div class="srcrow${isCur?' cur':''}" data-i="${i}">`+
               `<span class="cursor-col">${isCur?'>':' '}</span>`+
               `<span class="box">[${isCur?'✓':' '}]</span>`+
               `<span class="name">${escapeHtml(option.label)}</span>`+
               `</div>`;
      }).join('');
      listEl.querySelectorAll('.srcrow').forEach(row=>{
        row.onclick=()=>{ cursor=+row.dataset.i; render(); if(pending&&pending.confirmAction) pending.confirmAction(); };
      });
    }
    render();

    return new Promise(resolve=>{
      pending={
        type:'action',
        move:d=>{ cursor=(cursor+d+options.length)%options.length; render(); },
        confirmAction
      };
      function confirmAction(){
        if(!pending || pending.type!=='action') return;
        const chosen=options[cursor];
        listEl.remove(); blankEl.remove(); dividerEl.remove();
        headerEl.innerHTML = `<span class="q">?</span> ${questionHtml} <span class="b">${escapeHtml(chosen.label)}</span>`;
        pending=null; clearDock(); resolve(chosen.value);
      }
      setDock(null, '<kbd>↑</kbd><kbd>↓</kbd> move · <kbd>⏎</kbd> select');
    });
  }

  /* ---------- interaction: select a source ---------- */
  const SOURCES = [
    {name:'azd',     desc:'stable, official releases'},
    {name:'local', desc:'local development registry'}
  ];
  function selectSource(appliesToAll){
    // header line + list container + hint (matches Figma layout)
    line(`<span class="q">?</span> Select a source:`);
    if(appliesToAll) line(`<span class="d">  This source will apply to all following extension installations.</span>`);
    line('');
    const listEl = document.createElement('div');
    listEl.className='ln srclist';
    screen.appendChild(listEl);
    line('<span class="srcdivider">────────────────────────────</span>');
    const hintEl = line('<span class="srchint">Use arrows to move</span>');
    scroll();

    let cursor=1, selected=1;                 // default: local (as in the design)
    function render(){
      listEl.innerHTML = SOURCES.map((s,i)=>{
        const isCur=i===cursor;
        return `<div class="srcrow${isCur?' cur':''}" data-i="${i}">`+
               `<span class="cursor-col">${isCur?'>':' '}</span>`+
               `<span class="box">[${isCur?'✓':' '}]</span>`+
               `<span class="name">${s.name.padEnd(9,' ')}</span>`+
               `<span class="desc">${s.desc}</span>`+
               `</div>`;
      }).join('');
      listEl.querySelectorAll('.srcrow').forEach(row=>{
        row.onclick = ()=>{ cursor=selected=+row.dataset.i; render(); if(pending&&pending.confirmSource) pending.confirmSource(); };
      });
    }
    render();

    return new Promise(resolve=>{
      pending = {
        type:'select', resolve,
        move:d=>{ cursor=(cursor+d+SOURCES.length)%SOURCES.length; selected=cursor; render(); },
        toggle:()=>{ selected=cursor; render(); },
        confirm:()=>confirmSource(),
        get selected(){ return selected; }
      };
      function confirmSource(){
        if(!pending||pending.type!=='select') return;
        selected=cursor;                       // apply the currently focused source
        const chosen = SOURCES[selected].name;
        // collapse the interactive UI into a single answered line
        listEl.remove(); hintEl.remove();
        // remove the divider + the blank line + the header we printed
        // (walk back the last 3 non-list nodes)
        [...screen.querySelectorAll('.srcdivider')].forEach(n=>n.parentElement.remove());
        // rewrite the header line (last '? Select a source:' becomes answered)
        const headers=[...screen.querySelectorAll('.ln')].filter(n=>n.textContent.trim().startsWith('? Select a source'));
        const h=headers[headers.length-1];
        if(h) h.innerHTML = `<span class="q">?</span> Select a source: <span class="b">${chosen}</span>`;
        // trim any trailing blank line left behind
        const last=screen.lastElementChild;
        if(last && last.classList.contains('blank')) last.remove();
        pending=null; clearDock(); resolve(chosen);
      }
      pending.confirmSource=confirmSource;
      setDock(null, '<kbd>↑</kbd><kbd>↓</kbd> move · <kbd>space</kbd> select · <kbd>⏎</kbd> confirm');
    });
  }

  /* ---------- installing spinner → done ---------- */
  // azd's bouncing bar spinner (|===|) rather than braille dots.
  const FRAMES=['|===    |','| ===   |','|  ===  |','|   === |','|    ===|','|   === |','|  ===  |','| ===   |'];
  async function install(ext, source, addLeadingSpace=true){
    if(addLeadingSpace) line('');
    const el = line(`<span class="w">${FRAMES[0]}</span> Installing extension '${ext}'`);
    clearDock(); 
    const token=runToken; let i=0;
    const start=Date.now();
    while(Date.now()-start < 400){
      if(token!==runToken) return;
      el.innerHTML = `<span class="w">${FRAMES[i%FRAMES.length]}</span> Installing extension '${ext}'`;
      i++; await sleep(90);
    }
    el.innerHTML = `<span class="g">(✓) Done:</span> Installing extension '${ext}'`;
    scroll();
  }

  async function runOperation(action, completed, succeeded=true){
    const el = line(`<span class="w">${FRAMES[0]}</span> ${escapeHtml(action)}`);
    const token=runToken; let i=0;
    const start=Date.now();
    while(Date.now()-start < 500){
      if(token!==runToken) return;
      el.innerHTML = `<span class="w">${FRAMES[i%FRAMES.length]}</span> ${escapeHtml(action)}`;
      i++; await sleep(90);
    }
    el.innerHTML = succeeded
      ? `<span class="g">(✓) Done:</span> ${escapeHtml(completed)}`
      : `<span class="e">(×) Failed:</span> ${escapeHtml(completed)}`;
    scroll();
  }

  /* ---------- environment-name prompt (terminal end state) ---------- */
  function completeFlow(){
    dock.innerHTML =
      `<div class="donerow">`+
        `<span class="badge-done">✓ Prototype flow complete</span>`+
        `<button class="act primary" id="refreshBtn">↻ Refresh</button>`+
      `</div>`;
    document.getElementById('refreshBtn').onclick=()=>start(currentScenario);
  }
  // The prototype intentionally stops here — no provisioning/completion output.
  function envPromptEnd(){
    line('');
    line(`<span class="q">?</span> Enter a unique environment name: <span class="caret"></span>`);
    scroll();
    completeFlow();
  }
  function showSkipWarning(extensionName){
    const detail = extensionName ? ` for '${escapeHtml(extensionName)}'` : '';
    line(`<span class="warn">[Warning] Extension installation skipped${detail}. The workflow may fail without it.</span>`);
  }
  /* ===================================================================
     SCENARIO RUNNERS
     =================================================================== */
  async function scenario1(token){
    const ext={title:'Demo Extension', id:'demo-extension', source:'azd', desc:'This extension provides examples.'};
    await intro(ext);
    const a = await confirmYN(`Install ${ext.title}?`); if(token!==runToken) return;
    if(a==='n'){ line(''); showSkipWarning(ext.title); }
    else { await install(ext.id, ext.source); if(token!==runToken) return; }
    envPromptEnd();
  }

  async function scenario2(token){
    const ext={title:'Demo Extension', id:'demo-extension', source:'azd, local', desc:'This extension provides examples.'};
    const defaultSource='azd';
    await intro(ext, undefined, undefined, 'Sources:');
    const a = await confirmYNC(
      `Install ${ext.title} from \`${defaultSource}\`?`,
      {y:'install (recommended)', n:'skip', c:'yes, but change source'}
    ); if(token!==runToken) return;
    if(a==='n'){ line(''); showSkipWarning(ext.title); envPromptEnd(); return; }
    let src=defaultSource;
    if(a==='c'){ src = await selectSource(); if(token!==runToken) return; }
    await install(ext.id, src); if(token!==runToken) return;
    envPromptEnd();
  }

  async function scenario3(token){
    const exts=[
      {title:'Demo Extension',   id:'demo-extension',   source:'azd'},
      {title:'Storage Helper',   id:'storage-helper',   source:'azd'},
      {title:'Monitoring Tools', id:'monitoring-tools', source:'azd'}
    ];
    await listExtensions(exts, 'Source'); if(token!==runToken) return;
    const a = await confirmYNC(`Install all ${exts.length} required extensions?`, {
      y:'install all (recommended)', n:'skip', c:'choose for each extension'
    }); if(token!==runToken) return;

    if(a==='n'){ line(''); showSkipWarning(); envPromptEnd(); return; }

    line('');
    if(a==='y'){
      for(const e of exts){ await install(e.id, e.source, false); if(token!==runToken) return; }
    } else {
      // Select individually: prompt each extension, then install from its source.
      for(let k=0;k<exts.length;k++){
        const e=exts[k];
        if(k>0) line('');
        const yn = await confirmYN(`Install ${escapeHtml(e.title)}?`); if(token!==runToken) return;
        if(yn==='n'){ showSkipWarning(e.title); }
        else { await install(e.id, e.source); if(token!==runToken) return; }
      }
    }
    envPromptEnd();
  }

  async function scenario4(token){
    const exts=[
      {title:'Demo Extension',   id:'demo-extension',   source:'azd, local'},
      {title:'Storage Helper',   id:'storage-helper',   source:'azd, local'},
      {title:'Monitoring Tools', id:'monitoring-tools', source:'azd', sourceNote:'(+4 more)'}
    ];
    const defaultSource='azd';
    await listExtensions(exts, 'Sources'); if(token!==runToken) return;
    const a = await selectAction(
      `Install all ${exts.length} required extensions from \`${defaultSource}\`?`,
      [
        {value:'y', label:'Yes, install all from `azd` (recommended)'},
        {value:'c', label:'Yes, install all but change source'},
        {value:'s', label:'Choose for each extension'},
        {value:'n', label:'No, skip installation'}
      ]
    ); if(token!==runToken) return;

    if(a==='n'){ line(''); showSkipWarning(); envPromptEnd(); return; }

    line('');
    if(a==='y'){
      for(const e of exts){ await install(e.id, defaultSource, false); if(token!==runToken) return; }
    } else if(a==='c'){
      const src = await selectSource(true); if(token!==runToken) return;
      for(let i=0;i<exts.length;i++){
        const e=exts[i];
        await install(e.id, src, i===0); if(token!==runToken) return;
      }
    } else {
      // Select individually: prompt each extension, then show source selection (option-1 style).
      for(let k=0;k<exts.length;k++){
        const e=exts[k];
        if(k>0) line('');
        const yn = await confirmYNC(
          `Install ${escapeHtml(e.title)} from \`${defaultSource}\`?`,
          {y:'install (recommended)', n:'skip', c:'yes, but change source'}
        ); if(token!==runToken) return;
        if(yn==='n'){ showSkipWarning(e.title); continue; }
        let src=defaultSource;
        if(yn==='c'){ src = await selectSource(); if(token!==runToken) return; }
        await install(e.id, src); if(token!==runToken) return;
      }
    }
    envPromptEnd();
  }

  async function scenario5(token){
    const command='azd ai agent version';
    const ext={
      title:'Foundry agents (Beta)',
      id:'foundry-agents',
      source:'azd',
      desc:'Ship agents with Microsoft Foundry from your terminal. (Beta)'
    };
    await block([
      `<span class="w">${PROMPT}></span> <span class="w">${command}</span>`,
      `Command 'ai agent version' isn't available. Install the required extension to use this command.`,
      ``
    ], 95);
    await intro(ext, undefined, true, 'Source:', '');
    const a = await confirmYN(`Install ${ext.title}?`); if(token!==runToken) return;
    if(a==='n'){
      line('');
      line(`<span class="e">[Error] Can't run '${escapeHtml(command)}' because the required extension isn't installed.</span>`);
      completeFlow();
      return;
    }
    await install(ext.id, ext.source); if(token!==runToken) return;
    line('');
    await block([
      `Version: 1.0.0-beta.7`,
      `Commit: 701476730a2196ec7422aeb3d688ec64ed8f351a`,
      `Build Date: 2026-07-23T06:06:45.8680053+00:00`
    ], 70);
    completeFlow();
  }

  function singleSourceExtensions(){
    return [
      {title:'Demo Extension',   id:'demo-extension',   source:'azd'},
      {title:'Storage Helper',   id:'storage-helper',   source:'azd'},
      {title:'Monitoring Tools', id:'monitoring-tools', source:'azd'}
    ];
  }

  async function scenario6(token){
    const command='azd up --yolo';
    const exts=singleSourceExtensions();
    await listExtensions(exts, 'Source', command); if(token!==runToken) return;
    line(`<span class="d">YOLO mode: installing required extensions automatically.</span>`);
    for(let i=0;i<exts.length;i++){
      const e=exts[i];
      await install(e.id, e.source, i===0); if(token!==runToken) return;
    }
    line('');
    await runOperation('Initializing project...', 'Initialized project'); if(token!==runToken) return;
    await runOperation('Provisioning Azure resources...', 'Provisioned Azure resources'); if(token!==runToken) return;
    await runOperation('Deploying services...', 'Deployed services'); if(token!==runToken) return;
    line('');
    line(`<span class="g">SUCCESS: Your application was provisioned and deployed to Azure.</span>`);
    completeFlow();
  }

  async function scenario7(token){
    const command='azd up --no-prompt';
    const exts=singleSourceExtensions();
    await listExtensions(exts, 'Source', command); if(token!==runToken) return;
    line(`<span class="d">No-prompt mode doesn't install required extensions automatically.</span>`);
    await block([
      `Install them with:`,
      ``,
      ...exts.map(e=>`  <span class="b">azd extension install ${escapeHtml(e.id)}</span>`),
      ``
    ], 80);
    await runOperation('Initializing project...', 'Initialized project'); if(token!==runToken) return;
    await runOperation('Provisioning Azure resources...', 'Provisioned Azure resources'); if(token!==runToken) return;
    await runOperation('Deploying services...', 'Deployment stopped', false); if(token!==runToken) return;
    line('');
    line(`<span class="e">[Error] Deployment failed because required extensions aren't installed.</span>`);
    line(`Run the install commands above, then run \`${command}\` again.`);
    completeFlow();
  }

  const RUNNERS={1:scenario1,2:scenario2,3:scenario3,4:scenario4,5:scenario5,6:scenario6,7:scenario7};
  let currentScenario=1;

  function start(n){
    currentScenario=n;
    runToken++; const token=runToken;
    pending=null; clear(); clearDock();
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',+t.dataset.s===n));
    screen.focus({preventScroll:true});
    RUNNERS[n](token);
  }

  /* ===================================================================
     ACTION DOCK RENDERING
     =================================================================== */
  function setDock(buttons, hintHtml){
    // CLI-only: no clickable CTA buttons — show the keyboard hint text only.
    dock.innerHTML = hintHtml ? `<div class="dockhint">${hintHtml}</div>` : '';
  }
  function setHint(text){ dock.innerHTML=`<div class="dockhint">${text}</div>`; }
  function clearDock(){ dock.innerHTML=''; }

  /* ===================================================================
     KEYBOARD ROUTING
     =================================================================== */
  document.addEventListener('keydown',e=>{
    if(!pending) return;
    if(pending.type==='confirm'){
      if(e.key==='Enter'){
        e.preventDefault();
        const value=pending.value||'y';
        pending.ync ? answerYNC(value) : answerYN(value);
      } else if(e.key==='Backspace'){
        e.preventDefault(); stagePromptValue('');
      } else if(e.key==='Escape'){
        e.preventDefault(); stagePromptValue('n');
      } else {
        const k=e.key.toLowerCase();
        const valid=pending.ync ? ['y','n','c'] : ['y','n'];
        if(k.length===1 && valid.includes(k)){ e.preventDefault(); stagePromptValue(k); }
      }
    } else if(pending.type==='action'){
      if(e.key==='ArrowUp'){ e.preventDefault(); pending.move(-1); }
      else if(e.key==='ArrowDown'){ e.preventDefault(); pending.move(1); }
      else if(e.key==='Enter'){ e.preventDefault(); pending.confirmAction(); }
    } else if(pending.type==='select'){
      if(e.key==='ArrowUp'){ e.preventDefault(); pending.move(-1); }
      else if(e.key==='ArrowDown'){ e.preventDefault(); pending.move(1); }
      else if(e.key===' '){ e.preventDefault(); pending.toggle(); }
      else if(e.key==='Enter'){ e.preventDefault(); pending.confirmSource(); }
    }
    // env input handles its own Enter via its listener
  });

  /* ---------- utils ---------- */
  function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  /* ---------- wire tabs & boot ---------- */
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>start(+t.dataset.s)));
  start(1);
})();
</script>
