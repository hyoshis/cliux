<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>azd · Extension auto-install prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0b0d12;
  --bg-2:#111520;
  --border:#26303f;
  --text:#d7e0ea;
  --muted:#8a97a8;
  --dim:#5c6b7e;
  --accent:#4c9bf5;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(76,155,245,.10), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:2rem 1.5rem 3rem;
}
.wrap{width:100%; max-width:1080px}
.kicker{
  font-family:var(--mono); font-size:.74rem; letter-spacing:.2em;
  text-transform:uppercase; color:var(--accent);
  display:flex; align-items:center; gap:.55rem; margin-bottom:.9rem;
}
.kicker::before{content:"▍"; color:var(--accent)}
h1{font-size:clamp(1.5rem,3vw,2.1rem); font-weight:800; letter-spacing:-.02em; line-height:1.05}
h1 .mono{font-family:var(--mono); color:var(--accent)}
.lede{color:var(--muted); margin-top:.7rem; max-width:64ch; font-size:1rem; line-height:1.55}

/* Iframe stage */
.stage{
  border:1px solid var(--border); border-radius:14px; overflow:hidden;
  background:var(--bg-2);
  box-shadow:0 40px 90px -40px rgba(0,0,0,.85);
}
.stage iframe{
  display:block; width:100%; height:1180px; border:0; background:transparent;
}
.footer{margin-top:1.3rem; color:var(--dim); font-size:.78rem; font-family:var(--mono); text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <iframe src="./option-1.html" title="Extension auto-install prototype"></iframe>
  </div>

  <p class="footer">github.com/hyoshis/cliux</p>
</div>

</body>
</html>
